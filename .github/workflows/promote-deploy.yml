name: Promote to Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch deploy branch
        run: |
          git fetch origin deploy 2>/dev/null || {
            echo "deploy branch does not exist, creating from main"
            git push origin origin/main:refs/heads/deploy
            exit 0
          }

      - name: Check for build-relevant changes
        id: check-changes
        run: |
          CHANGES=$(git diff --name-only origin/deploy..origin/main -- packages/server-go go.mod go.sum)
          if [ -z "$CHANGES" ]; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "docs-only, deploy unchanged"
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "Build-relevant changes detected:"
            echo "$CHANGES"
          fi

      - name: Promote main to deploy
        if: steps.check-changes.outputs.has-changes == 'true'
        run: |
          git push origin main:deploy
